{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto pb-10">
    <div class="mb-8">
        <h2 class="text-2xl font-bold mb-2 flex items-center gap-3"><i class="fas fa-film text-purple-400"></i> Video Studio</h2>
        <p class="text-slate-400 text-sm">Cari video, tambah lagu YouTube, beri teks, dan unduh hasilnya.</p>
    </div>

    <!-- SEARCH VIDEO -->
    <section class="mb-10">
        <h3 class="text-lg font-semibold mb-4 text-white/90">1. Pilih Video Mentahan</h3>
        <div class="flex gap-2 mb-6">
            <input type="text" id="videoSearchInput" placeholder="Contoh: cyberpunk, rain..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-purple-500 transition text-sm text-white">
            <button onclick="searchVideos()" class="bg-purple-600 hover:bg-purple-500 text-white px-6 py-3 rounded-xl font-medium transition shadow-lg shadow-purple-600/20">Cari Video</button>
        </div>
        <div id="videoGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="col-span-full text-center text-slate-500 py-12 glass rounded-2xl border border-dashed border-white/10">Hasil pencarian akan muncul di sini.</div>
        </div>
    </section>

    <!-- EDITOR AREA -->
    <section id="editorSection" class="hidden mb-10 fade-in">
        <div class="glass p-6 rounded-3xl border border-purple-500/20 neon-border">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-white"><i class="fas fa-check-circle text-green-400 mr-2"></i> Editor Aktif</h3>
                <button onclick="clearSelection()" class="text-xs text-slate-400 hover:text-red-400">Ganti Video</button>
            </div>
            
            <div class="aspect-[9/16] max-h-[400px] w-full bg-black rounded-2xl overflow-hidden border border-white/10 mb-6 relative group">
                <video id="selectedVideoPlayer" class="w-full h-full object-cover" loop muted playsinline></video>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span id="previewTextOverlay" class="text-2xl font-bold text-white drop-shadow-md opacity-0 transition-opacity text-center px-4"></span>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-xs text-slate-400 mb-2 uppercase tracking-wider">Teks Overlay</label>
                <input type="text" id="overlayTextInput" placeholder="Tulis caption di sini..." oninput="updateTextPreview()" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-purple-500 transition text-sm text-white">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="togglePreview()" class="py-3 rounded-xl font-bold border border-white/20 hover:bg-white/5 transition text-sm"><i class="fas fa-play mr-2"></i> PREVIEW</button>
                <button onclick="downloadFinalVideo()" class="py-3 rounded-xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 hover:opacity-90 transition shadow-lg shadow-purple-600/20 text-sm"><i class="fas fa-download mr-2"></i> UNDUH SEKARANG</button>
            </div>
        </div>
    </section>

    <!-- SEARCH AUDIO -->
    <section class="mb-10">
        <h3 class="text-lg font-semibold mb-4 text-white/90 flex items-center gap-2"><i class="fas fa-music text-blue-400"></i> Tambahkan Audio (YouTube)</h3>
        <div class="flex gap-2 mb-4">
            <input type="text" id="audioSearchInput" placeholder="Judul lagu..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 transition text-sm text-white">
            <button onclick="searchAudio()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-medium transition shadow-lg shadow-blue-600/20">Cari Lagu</button>
        </div>
        <div id="audioResults" class="space-y-2 max-h-60 overflow-y-auto pr-1 custom-scrollbar"></div>
        <div id="selectedAudioStatus" class="hidden mt-4 p-3 rounded-xl bg-green-500/10 border border-green-500/20 text-green-400 text-xs flex items-center gap-2">
            <i class="fas fa-check-circle"></i> Audio siap: <span id="audioFileName" class="font-bold text-white"></span>
        </div>
    </section>
</div>

<script>
    let selectedVideoUrl = null;
    let selectedAudioFile = null;

    async function searchVideos() {
        const query = document.getElementById('videoSearchInput').value.trim();
        if (!query) return alert('Masukkan kata kunci!');
        const grid = document.getElementById('videoGrid');
        grid.innerHTML = '<div class="col-span-full text-center py-10"><i class="fas fa-spinner fa-spin text-2xl text-purple-400"></i></div>';
        
        try {
            const res = await fetch(`/api/search_video?q=${encodeURIComponent(query)}`);
            const data = await res.json();
            grid.innerHTML = '';
            if (data.videos) {
                data.videos.forEach(video => {
                    const clip = video.video_files.find(f => f.width && f.width <= 720) || video.video_files[0];
                    grid.innerHTML += `
                        <div class="glass rounded-2xl overflow-hidden group relative aspect-[9/16] cursor-pointer border border-white/5 hover:border-purple-500/50 transition-all" onclick="selectVideo('${clip.link}')">
                            <img src="${video.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition flex items-center justify-center"><i class="fas fa-play text-white text-2xl opacity-80"></i></div>
                        </div>`;
                });
            }
        } catch (err) { grid.innerHTML = '<div class="col-span-full text-center text-red-400 py-10">Error API Key atau Internet.</div>'; }
    }

    function selectVideo(url) {
        selectedVideoUrl = url;
        document.getElementById('selectedVideoPlayer').src = url;
        document.getElementById('selectedVideoPlayer').play();
        document.getElementById('editorSection').classList.remove('hidden');
        document.getElementById('editorSection').scrollIntoView({ behavior: 'smooth' });
    }

    function clearSelection() {
        selectedVideoUrl = null;
        document.getElementById('selectedVideoPlayer').src = '';
        document.getElementById('editorSection').classList.add('hidden');
        document.getElementById('overlayTextInput').value = '';
        updateTextPreview();
    }

    function updateTextPreview() {
        const text = document.getElementById('overlayTextInput').value;
        const overlay = document.getElementById('previewTextOverlay');
        overlay.innerText = text;
        overlay.style.opacity = text.length > 0 ? '1' : '0';
    }

    function togglePreview() {
        const player = document.getElementById('selectedVideoPlayer');
        player.muted = !player.muted;
        player.paused ? player.play() : player.pause();
    }

    async function searchAudio() {
        const query = document.getElementById('audioSearchInput').value.trim();
        if (!query) return alert('Masukkan judul lagu!');
        const resDiv = document.getElementById('audioResults');
        resDiv.innerHTML = '<div class="text-center py-4"><i class="fas fa-spinner fa-spin text-blue-400"></i></div>';
        
        try {
            const res = await fetch(`/api/search_audio?q=${encodeURIComponent(query)}`);
            const data = await res.json();
            resDiv.innerHTML = '';
            data.forEach(song => {
                resDiv.innerHTML += `
                    <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl text-sm hover:bg-white/10 transition group border border-white/5">
                        <div class="truncate w-3/4 pr-2"><p class="text-white font-medium truncate">${song.title}</p></div>
                        <button onclick="downloadAudio('${song.url}', this)" class="text-blue-400 hover:text-white bg-blue-500/10 hover:bg-blue-500 p-2 rounded-lg transition"><i class="fas fa-download"></i></button>
                    </div>`;
            });
        } catch (err) { resDiv.innerHTML = '<p class="text-xs text-red-400 text-center">Error search audio.</p>'; }
    }

    async function downloadAudio(url, btnElement) {
        const originalHTML = btnElement.innerHTML;
        btnElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btnElement.disabled = true;
        
        try {
            const res = await fetch('/api/download_audio', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });
            const data = await res.json();
            if (data.status === 'success') {
                selectedAudioFile = data.filename;
                btnElement.innerHTML = '<i class="fas fa-check"></i>';
                btnElement.classList.replace('text-blue-400', 'text-green-400');
                document.getElementById('selectedAudioStatus').classList.remove('hidden');
                document.getElementById('audioFileName').innerText = data.filename;
            } else { throw new Error('Fail'); }
        } catch (err) {
            btnElement.innerHTML = '<i class="fas fa-times"></i>';
            setTimeout(() => { btnElement.innerHTML = originalHTML; btnElement.disabled = false; }, 2000);
        }
    }

    async function downloadFinalVideo() {
        if (!selectedVideoUrl) return alert('Pilih video dulu!');
        const btn = document.querySelector('button[onclick="downloadFinalVideo()"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Rendering...';
        btn.disabled = true;

        try {
            const res = await fetch('/api/render_video', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    video_url: selectedVideoUrl,
                    audio_filename: selectedAudioFile,
                    text: document.getElementById('overlayTextInput').value
                })
            });
            const data = await res.json();
            if (data.status === 'success') {
                const link = document.createElement('a');
                link.href = data.download_url;
                link.download = 'CAA_NEXUS_Video.mp4';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                btn.innerHTML = '<i class="fas fa-check"></i> Selesai!';
            } else { alert('Gagal render: ' + data.error); }
        } catch (err) { alert('Error server'); }
        finally { btn.innerHTML = originalText; btn.disabled = false; }
    }
</script>
{% endblock %}
